on: [push, pull_request]

name: Clippy check
jobs:
  clippy_check:
    permissions:
      security-events: write
      checks: write
      contents: read
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake ninja-build \
            gcc-14 g++-14 build-essential binutils libtbb-dev pkg-config coinor-libcbc-dev libcoinutils-dev

      - uses: actions/checkout@v4
      # The nightly compiler encountered a recursive async-drop query
      # failure in sqlx-core 0.8.6 before Clippy could inspect this crate.
      # Use the stable toolchain pinned by rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - run: cargo install clippy-sarif sarif-fmt
      - run: set -o pipefail; cargo clippy --all-targets --all-features --message-format=json |
          clippy-sarif | tee results.sarif | sarif-fmt
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: Rust Clippy