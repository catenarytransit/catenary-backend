name: Validate Diesel migrations
on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'tools/check_diesel_migrations.py'
      - '.github/workflows/diesel-migrations.yml'
  push:
    paths:
      - 'migrations/**'
      - 'tools/check_diesel_migrations.py'
      - '.github/workflows/diesel-migrations.yml'
permissions:
  contents: read
jobs:
  migration-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_diesel_migrations.py
