name: Rust

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler redis cmake ninja-build \
          gcc-14 g++-14 build-essential binutils libtbb-dev pkg-config coinor-libcbc-dev libcoinutils-dev

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        cache-workspace-crates: true
    - name: Build
      run: cargo build --verbose
    - name: Test response size middleware
      run: cargo test --lib response_size::tests -- --nocapture
    - name: Test compact RAPTOR and profile-search regressions
      run: cargo test --lib routing_common::profile -- --nocapture
    - name: Test Edelweiss street geometry cache parameters
      run: cargo test --bin edelweiss street_geometry_cache_distinguishes_routing_parameters -- --nocapture
