name: Directory PostgreSQL regressions

on:
  pull_request:
    paths:
      - 'src/birch/directory.rs'
      - 'src/birch/sql/**'
      - 'tests/test_directory_queries.py'
      - '.github/workflows/directory-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory-queries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: directory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check membership, slug behavior, and aggregate execution counts
        env:
          DIRECTORY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/directory_test
        run: python tests/test_directory_queries.py
