[package]
name = "osm_manager"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "osm_manager"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
geojson = "0.24"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
