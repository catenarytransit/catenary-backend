[package]
name = "catenary-edelweiss-stream-check"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
catenary = { package = "catenary-raptor-check", path = "../raptor-check" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
actix = "0.13.5"
actix-web = "4.18"
actix-web-actors = "4.3"
tokio = { version = "1.54", features = ["sync"] }
tokio-stream = "0.1.17"

[dev-dependencies]
awc = "3"
futures-util = "0.3"
